#!/bin/bash
#
# ppms_to_adhoc.conf - Central configuration for PPMS to ADHOC pipeline
# Source this file from all scripts: . /oracle/ppms_to_adhoc/ppms_to_adhoc.conf
#

# ============================================================
# Oracle Environment - PPMS (Source)
# ============================================================
PPMS_HOST="dru110a"
PPMS_SID="ppms3p"
PPMS_ORACLE_HOME="/oracle11/product/11.2.0.3/db_1"

# ============================================================
# Oracle Environment - ADHOC (Target)
# ============================================================
ADHOC_HOST="t1u904"
ADHOC_SID="adhoc1p"
ADHOC_ORACLE_HOME="/oracle/product/11.2.0.4/db_1"

# ============================================================
# NFS Paths (same physical storage, different mount points)
# ============================================================
# From PPMS server (dru110a):
NFS_PATH_PPMS="/net/dru112c/dba_data/RAMIN/PPMS3P"
# From ADHOC server (t1u904) - update this to the correct mount point:
# Note: /net/drst002/data/RAMIN/PPMS3P is DEPRECATED and no longer exists
NFS_PATH_ADHOC="/net/dru112c/dba_data/RAMIN/PPMS3P"
# Oracle directory objects:
ORA_DIR_EXPORT="RAM_EXP_DRS2"
ORA_DIR_IMPORT="RAM_IMP_DRS2"

# ============================================================
# Remote execution (for single-side pipeline from PPMS)
# ============================================================
REMOTE_USER="oracle"
REMOTE_INSTALL_DIR="/oracle/ppms_to_adhoc"

# ============================================================
# Lock & Coordination (used in two-server mode)
# ============================================================
LOCK_HOST="${ADHOC_HOST}"
LOCK_USER="oracle"
LOCK_FILE="/tmp/exp.lock"
# Max hours to wait for lock in two-server mode before declaring stale
LOCK_MAX_WAIT_HOURS=12

# Expected dump file count for validation
EXPECTED_DUMP_COUNT=58
# Max age of dump files in days (-mtime)
DUMP_MAX_AGE_DAYS=3

# ============================================================
# Email
# ============================================================
MAIL_DBA="isdcdba@mtnirancell.ir"
MAIL_ALIREZA="alireza.aghaja@mtnirancell.ir"

# ============================================================
# Logging
# ============================================================
LOG_DIR_ADHOC="/oracle/ppms_to_adhoc/logs"
LOG_DIR_PPMS="/oracle/ppms_to_adhoc/logs"

# ============================================================
# SQL Scripts (ADHOC server paths)
# ============================================================
SQL_DIR="/oracle/ppms_to_adhoc/sql"

# ============================================================
# Parallelism
# ============================================================
# Export parallelism
EXP_PARALLEL_CARDS=20
EXP_PARALLEL_LARGE=8
EXP_PARALLEL_MEDIUM=4
# Import parallelism
IMP_PARALLEL_CARDS=20
IMP_PARALLEL_LARGE=8
IMP_PARALLEL_MEDIUM=4
# Index creation parallelism
IDX_PARALLEL_LARGE=30
IDX_PARALLEL_SMALL=12

# ============================================================
# NLS
# ============================================================
NLS_LANG="american_america.WE8ISO8859P1"
export NLS_LANG

# ============================================================
# Table lists (bash arrays - used by run_export.sh / run_import.sh)
# Import streaming: HEAVY = Stream 1, LIGHT = Stream 2
# ============================================================

# Stream 1: large tables, imported with high parallelism (ram_imp1a equivalent)
HEAVY_TABLES=(
    "PREPAID.TPS01_CARDS"
    "PREPAID.TPS01_LOG_CARDS"
)

# Stream 2: remaining tables (ram_imp2a equivalent)
LIGHT_TABLES=(
    "PREPAID.TPS107_DISTRIBUTOR_DETAILS"
    "PREPAID.TPS73_LOGICAL_ORDERS"
    "PREPAID.TPS11_OUTLET_CODES"
    "PREPAID.TPS30_CARD_BOXES"
    "PREPAID.TPS31_CARD_BRICKS"
    "PREPAID.TPS08_DENOMINATION_TYPES"
    "PREPAID.TPS6073_LOGICAL_ORDERS"
    "PREPAID.TPS01_LOG_USED_CARDS"
    "PREPAID.TPS09_PPAS_LOG_CARD_PARAMETERS"
    "PREPAID.TPS09_PPAS_CARD_PARAMETERS"
    "PREPAID.TPS145_STOCK_ORDERS"
    "PREPAID.TPS74_LOGICAL_ORDERS_DETAIL"
    "PREPAID.TPS6074_LOGICAL_ORDERS_DETAIL"
)

# Special: uses TABLE_EXISTS_ACTION=REPLACE (not dropped/NOLOGGING in Phase 1)
SPECIAL_IMPORT_TABLE="PREPAID.TPS6074_LOGICAL_ORDERS_DETAIL"

# Extra tables to DROP in Phase 1 that are not in the import lists
DROP_EXTRA_TABLES=("REPORT.TPS01_USED_CARDS")

# PII columns removed after import (SET UNUSED)
PII_TABLES=(
    "REPORT.TPS01_CARDS"
    "REPORT.TPS01_LOG_CARDS"
    "REPORT.TPS01_LOG_USED_CARDS"
)
PII_COLUMNS="CPS01_PIN_NUMBER, CPS01_ACCESS_CODE"

# PREPAID.TPS01_USED_CARDS  -- currently excluded from pipeline
