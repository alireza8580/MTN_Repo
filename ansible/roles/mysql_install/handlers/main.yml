---
# Handlers for mysql_install role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Restart mysqld
  ansible.builtin.systemd:
    name: "mysqld@{{ mysql_port }}"
    state: restarted
  when: mysql_service_started | default(false)

- name: Start mysqld
  ansible.builtin.systemd:
    name: "mysqld@{{ mysql_port }}"
    state: started
    enabled: yes
  register: mysql_service_started
