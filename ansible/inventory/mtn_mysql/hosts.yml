# MTN MySQL 8.4 Inventory Template
# Copy this file and customize for your environment

all:
  vars:
    # Ansible connection
    ansible_user: mysql
    ansible_become: yes
    ansible_become_user: root
    ansible_become_method: sudo
    
    # MySQL version and paths
    mysql_version: "8.4"
    mysql_port: 3306
    mysql_base_dir: /data
    mysql_data_dir: /data/3306/mysqlDB
    mysql_log_dir: /data/3306/log
    mysql_binlog_dir: /data/3306/BLfile
    mysql_socket_dir: /data/3306/socket
    mysql_pid_dir: /data/3306/PID
    mysql_audit_dir: /data/3306/audit
    mysql_tmp_dir: /data/3306/tmpdir
    
    # LVM Configuration
    mysql_disk_device: /dev/sdb
    mysql_vg_name: data_vg
    mysql_lv_name: data_lv
    mysql_mount_point: /data
    mysql_filesystem: xfs
    
    # NFS Backup mount
    mysql_nfs_backup: "dru112c:/db-bkp"
    # Alternative: t1u103d:/T1_dbbkp or t3dba-bkup01:/mysql_bk
    
    # MySQL root password (Use Ansible Vault in production!)
    mysql_root_password: "R0L3#dbAhs_2021"
    
    # CIS configuration
    cis_assessor_version: "4.56.0"
    cis_benchmark_file: "CIS_Oracle_MySQL_Enterprise_Edition_8.4_Benchmark_v1.0.0-xccdf.xml"
    
    # Security settings (CIS 2.7, 2.8, 7.4)
    default_password_lifetime: 365
    password_history: 5
    password_reuse_interval: 365

  children:
    mysql_servers:
      hosts:
        # Example hosts - customize for your environment
        # t3vl717:
        #   ansible_host: 10.x.x.x
        #   mysql_server_id: 717
        #   is_master: true
        #   is_backup_node: false
